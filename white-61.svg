<path d="M0 0 C0 15.51 0 31.02 0 47 C-3.63 47 -7.26 47 -11 47 C-11.33 35.12 -11.66 23.24 -12 11 C-14.64 12.65 -17.28 14.3 -20 16 C-20.66 16 -21.32 16 -22 16 C-22.651 12.811 -22.793 10.173 -22 7 C-15.517 -0.746 -10.368 0 0 0 Z " fill="#FFFFFF" transform="translate(91,16)"/>
<path d="M0 0 C3.062 0.312 3.062 0.312 5 1.375 C6.679 4.437 5.749 7.006 5.062 10.312 C3.082 10.972 1.103 11.633 -0.938 12.312 C-3.5 10.125 -3.5 10.125 -5.938 7.312 C-5.833 2.827 -4.671 0.497 0 0 Z " fill="#FFFFFF" transform="translate(64.9375,51.6875)"/>

 </g></svg>
 <!-- lower internal refraction -->
 <path d="M26 155 Q180 205 334 155 L334 192 H26Z" fill="#9bc9e8" opacity=".055"/>
 <!-- thick polished outer bevel and inner glass edge -->
 <rect x="18.8" y="18.8" width="322.4" height="172.4" rx="30.2" fill="none" stroke="url(#bevel)" stroke-width="3"/>
 <rect x="23" y="23" width="314" height="164" rx="27" fill="none" stroke="url(#innerEdge)" stroke-width="1.4"/>
</g>
</svg>