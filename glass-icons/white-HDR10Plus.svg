<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="425" height="210" viewBox="0 0 425 210">
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
  <stop offset="0" stop-color="#FFD21A" stop-opacity=".19"/>
  <stop offset=".20" stop-color="#172431" stop-opacity=".54"/>
  <stop offset=".62" stop-color="#080e16" stop-opacity=".76"/>
  <stop offset="1" stop-color="#594000" stop-opacity=".38"/>
 </linearGradient>
 <linearGradient id="topGlass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
  <stop offset=".12" stop-color="#FFD21A" stop-opacity=".16"/>
  <stop offset=".52" stop-color="#ffffff" stop-opacity=".035"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="bevel" x1="0" y1="0" x2="0.8" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
  <stop offset=".16" stop-color="#FFD21A" stop-opacity=".90"/>
  <stop offset=".55" stop-color="#ffffff" stop-opacity=".24"/>
  <stop offset=".82" stop-color="#FFD21A" stop-opacity=".72"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".80"/>
 </linearGradient>
 <linearGradient id="innerEdge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
  <stop offset=".22" stop-color="#ffffff" stop-opacity=".04"/>
  <stop offset=".78" stop-color="#FFD21A" stop-opacity=".05"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
 </linearGradient>
 <radialGradient id="colorBloom" cx="50%" cy="90%" r="80%">
  <stop offset="0" stop-color="#FFD21A" stop-opacity=".27"/>
  <stop offset=".45" stop-color="#FFD21A" stop-opacity=".10"/>
  <stop offset="1" stop-color="#FFD21A" stop-opacity="0"/>
 </radialGradient>
 <filter id="outerGlow" x="-60%" y="-90%" width="220%" height="280%">
  <feGaussianBlur stdDeviation="13"/>
 </filter>
 <filter id="drop" x="-30%" y="-50%" width="160%" height="210%">
  <feGaussianBlur stdDeviation="8"/>
 </filter>
 <clipPath id="tileClip"><rect x="18" y="18" width="389" height="174" rx="31"/></clipPath>
</defs>
<!-- soft cast shadow and coloured light outside the glass -->
<rect x="24" y="29" width="377" height="174" rx="34" fill="#000000" opacity=".78" filter="url(#drop)"/>
<rect x="18" y="18" width="389" height="174" rx="31" fill="#FFD21A" opacity=".42" filter="url(#outerGlow)"/>
<g clip-path="url(#tileClip)">
 <!-- deep transparent glass body -->
 <rect x="18" y="18" width="389" height="174" rx="31" fill="#071019" opacity=".72"/>
 <rect x="18" y="18" width="389" height="174" rx="31" fill="url(#body)"/>
 <rect x="18" y="18" width="389" height="174" rx="31" fill="url(#colorBloom)"/>
 <!-- broad curved reflection, not a simple line -->
 <path d="M18 62 Q18 18 62 18 H363 Q407 18 407 62 L407 88 Q212.5 115 18 88Z" fill="url(#topGlass)"/>
 <!-- original vector artwork preserved -->
 <svg x="26" y="25" width="373" height="156" viewBox="0 0 284 134"><g transform="translate(0.0000,0)"><image x="12.00" y="42.80" width="260.00" height="48.41" href="data:image/png;base64,"/></g></svg>
 <!-- lower internal refraction -->
 <path d="M26 155 Q212.5 205 399 155 L399 192 H26Z" fill="#FFD21A" opacity=".055"/>
 <!-- thick polished outer bevel and inner glass edge -->
 <rect x="18.8" y="18.8" width="387.4" height="172.4" rx="30.2" fill="none" stroke="url(#bevel)" stroke-width="3"/>
 <rect x="23" y="23" width="379" height="164" rx="27" fill="none" stroke="url(#innerEdge)" stroke-width="1.4"/>
</g>
</svg>