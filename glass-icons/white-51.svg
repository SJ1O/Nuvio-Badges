<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210">
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
  <stop offset="0" stop-color="#9bc9e8" stop-opacity=".19"/>
  <stop offset=".20" stop-color="#172431" stop-opacity=".54"/>
  <stop offset=".62" stop-color="#080e16" stop-opacity=".76"/>
  <stop offset="1" stop-color="#1c3445" stop-opacity=".38"/>
 </linearGradient>
 <linearGradient id="topGlass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
  <stop offset=".12" stop-color="#9bc9e8" stop-opacity=".16"/>
  <stop offset=".52" stop-color="#ffffff" stop-opacity=".035"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="bevel" x1="0" y1="0" x2="0.8" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
  <stop offset=".16" stop-color="#9bc9e8" stop-opacity=".90"/>
  <stop offset=".55" stop-color="#ffffff" stop-opacity=".24"/>
  <stop offset=".82" stop-color="#9bc9e8" stop-opacity=".72"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".80"/>
 </linearGradient>
 <linearGradient id="innerEdge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
  <stop offset=".22" stop-color="#ffffff" stop-opacity=".04"/>
  <stop offset=".78" stop-color="#9bc9e8" stop-opacity=".05"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
 </linearGradient>
 <radialGradient id="colorBloom" cx="50%" cy="90%" r="80%">
  <stop offset="0" stop-color="#9bc9e8" stop-opacity=".27"/>
  <stop offset=".45" stop-color="#9bc9e8" stop-opacity=".10"/>
  <stop offset="1" stop-color="#9bc9e8" stop-opacity="0"/>
 </radialGradient>
 <filter id="outerGlow" x="-60%" y="-90%" width="220%" height="280%">
  <feGaussianBlur stdDeviation="13"/>
 </filter>
 <filter id="drop" x="-30%" y="-50%" width="160%" height="210%">
  <feGaussianBlur stdDeviation="8"/>
 </filter>
 <clipPath id="tileClip"><rect x="18" y="18" width="324" height="174" rx="31"/></clipPath>
</defs>
<!-- soft cast shadow and coloured light outside the glass -->
<rect x="24" y="29" width="312" height="174" rx="34" fill="#000000" opacity=".78" filter="url(#drop)"/>
<rect x="18" y="18" width="324" height="174" rx="31" fill="#9bc9e8" opacity=".42" filter="url(#outerGlow)"/>
<g clip-path="url(#tileClip)">
 <!-- deep transparent glass body -->
 <rect x="18" y="18" width="324" height="174" rx="31" fill="#071019" opacity=".72"/>
 <rect x="18" y="18" width="324" height="174" rx="31" fill="url(#body)"/>
 <rect x="18" y="18" width="324" height="174" rx="31" fill="url(#colorBloom)"/>
 <!-- broad curved reflection, not a simple line -->
 <path d="M18 62 Q18 18 62 18 H298 Q342 18 342 62 L342 88 Q180 115 18 88Z" fill="url(#topGlass)"/>
 <!-- original vector artwork preserved -->
 <svg x="38" y="38" width="284" height="134" viewBox="0 0 112 80" preserveAspectRatio="xMidYMid meet">
