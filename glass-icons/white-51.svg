<ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M0 0 C0 15.51 0 31.02 0 47 C-3.3 47 -6.6 47 -10 47 C-10.33 35.12 -10.66 23.24 -11 11 C-13.64 12.65 -16.28 14.3 -19 16 C-19.66 16 -20.32 16 -21 16 C-21.623 12.495 -21.824 9.483 -21 6 C-14.829 -0.708 -9.111 0 0 0 Z " fill="#FFFFFF" transform="translate(90,16)" />
<ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M0 0 C1.938 1.688 1.938 1.688 3 4 C2.923 7.175 2.399 8.542 0.312 10.938 C-2 12 -2 12 -5.188 11.25 C-8 10 -8 10 -9 9 C-9.456 3.759 -9.456 3.759 -7.875 1.125 C-5.089 -0.547 -3.18 -0.464 0 0 Z " fill="#FFFFFF" transform="translate(68,52)" />

 </svg>
 <!-- lower internal refraction -->
 <path d="M26 155 Q180 205 334 155 L334 192 H26Z" fill="#9bc9e8" opacity=".055"/>
 <!-- thick polished outer bevel and inner glass edge -->
 <rect x="18.8" y="18.8" width="322.4" height="172.4" rx="30.2" fill="none" stroke="url(#bevel)" stroke-width="3"/>
 <rect x="23" y="23" width="314" height="164" rx="27" fill="none" stroke="url(#innerEdge)" stroke-width="1.4"/>
</g>
</svg>